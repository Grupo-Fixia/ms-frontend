name: ci
on:
  push:
    branches: [develop, Qa]
  pull_request:
    branches: [develop, Qa]

permissions:
  contents: read

jobs:
  # Pruebas del frontend: corre en cada PR y push a develop/Qa. Si falla, no se
  # construye ni se despliega la imagen.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter 3.22.0 (misma versión del Dockerfile)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests with coverage
        run: flutter test --coverage
      - name: Check coverage (Quality Gate >= 80 %)
        run: bash tool/check_coverage.sh 80 coverage/lcov.info
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/Qa'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            USERS_API_BASE_URL=${{ vars.QA_BASE_URL || 'http://10.43.98.211' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
