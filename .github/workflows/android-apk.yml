name: android-apk

# APK de Android de Fixia (GC-550). Se ejecuta a mano desde Actions
# («Run workflow») o al subir una etiqueta apk-v*. Compila el APK de release,
# lo publica como fixia.apk en un Release de GitHub con su SHA-256 y deja el
# enlace estable:
#   https://github.com/Grupo-Fixia/ms-frontend/releases/latest/download/fixia.apk
# que es el que la landing ofrece con ANDROID_APK_URL.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: URL base de la API que usará la app
        required: true
        default: http://10.43.98.211
      version:
        description: Versión visible del APK (por ejemplo 1.0.0)
        required: true
        default: 1.0.0
  push:
    tags: ['apk-v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ inputs.api_url || 'http://10.43.98.211' }}
    steps:
      - uses: actions/checkout@v4

      # Con etiqueta, la versión sale de ella (apk-v1.0.1 → 1.0.1); a mano,
      # del campo «version».
      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#apk-v}"
          else
            VERSION="${INPUT_VERSION:-1.0.0}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Versión: $VERSION"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.22.0 (misma versión del CI)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      # Si el repositorio tiene la llave del equipo en los secretos, se firma
      # con ella; si no, con la de depuración (sirve para QA, no para tienda).
      - name: Prepare release key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Sin llave de release: se firma con la de depuración."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/fixia-release.jks
          {
            echo "storeFile=fixia-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release \
            --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define=USERS_API_BASE_URL="$API_URL"
          cp build/app/outputs/flutter-apk/app-release.apk fixia.apk
          sha256sum fixia.apk > fixia.apk.sha256
          cat fixia.apk.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('apk-v{0}-{1}', env.VERSION, github.run_number) }}
          name: Fixia Android ${{ env.VERSION }} (${{ github.run_number }})
          body: |
            APK de Fixia para Android (GC-550).
            - API: ${{ env.API_URL }}
            - Commit: ${{ github.sha }}
            - SHA-256: ver fixia.apk.sha256
            Para instalar: descargar fixia.apk en el celular y permitir
            «instalar apps de origen desconocido» para el navegador.
          files: |
            fixia.apk
            fixia.apk.sha256
          make_latest: true
