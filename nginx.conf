server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Sirviendo archivos estáticos del frontend de Flutter
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para apigateway (Traefik) - Descomentar y ajustar si es necesario
    # location /api/ {
    #     proxy_pass http://traefik.apps.svc.cluster.local/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}
