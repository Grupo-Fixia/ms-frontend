server {
    listen 8080;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Cabeceras de endurecimiento OWASP ZAP
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.trycloudflare.com http://10.43.98.231 http://10.43.98.244 http://10.43.98.211 https://www.gstatic.com https://fonts.gstatic.com; frame-ancestors 'none';" always;
    etag off;
    if_modified_since off;

    # SPA: cualquier ruta desconocida vuelve al index.html de Flutter
    location / {
        try_files $uri $uri/ /index.html;
    }
}
