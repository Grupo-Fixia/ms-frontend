  <script>
    // 1. Limpieza de Service Workers antiguos (--pwa-strategy=none)
    (function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (regs.length === 0) return;
        var clears = window.caches
          ? caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            })
          : Promise.resolve();
        return Promise.all(regs.map(function (r) { return r.unregister(); }))
          .then(function () { return clears; })
          .then(function () {
            try {
              if (navigator.serviceWorker.controller &&
                  !sessionStorage.getItem('fixia-sw-cleared')) {
                sessionStorage.setItem('fixia-sw-cleared', '1');
                location.reload();
              }
            } catch (e) {}
          });
      }).catch(function () {});
    })();

    // 2. Cifrado de Payload de Credenciales (ENC:v1:<nonce_hex>:<ciphertext_b64>)
    // Oculta la contraseña en el inspector F12 del navegador usando SHA-256 CTR con nonce aleatorio de 128 bits.
    (function () {
      var SECRET = "FixiaTransportKey#2026!ProdV4";
      var K = [
        0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
        0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
        0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
        0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
        0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
        0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
        0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
        0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
      ];
      function rotr(n, x) { return (x >>> n) | (x << (32 - n)); }
      function sha256Bytes(asciiStr) {
        var msg = new TextEncoder().encode(asciiStr);
        var bitLen = msg.length * 8;
        var padLen = ((msg.length + 9 + 63) & ~63);
        var buf = new Uint8Array(padLen);
        buf.set(msg);
        buf[msg.length] = 0x80;
        var dv = new DataView(buf.buffer);
        dv.setUint32(padLen - 4, bitLen >>> 0, false);
        dv.setUint32(padLen - 8, Math.floor(bitLen / 0x100000000), false);
        var H0=0x6a09e667,H1=0xbb67ae85,H2=0x3c6ef372,H3=0xa54ff53a,H4=0x510e527f,H5=0x9b05688c,H6=0x1f83d9ab,H7=0x5be0cd19;
        var W = new Int32Array(64);
        for (var o = 0; o < padLen; o += 64) {
          for (var t = 0; t < 16; t++) W[t] = dv.getInt32(o + t * 4, false);
          for (var t = 16; t < 64; t++) {
            var s0 = rotr(7, W[t-15]) ^ rotr(18, W[t-15]) ^ (W[t-15] >>> 3);
            var s1 = rotr(17, W[t-2]) ^ rotr(19, W[t-2]) ^ (W[t-2] >>> 10);
            W[t] = (W[t-16] + s0 + W[t-7] + s1) | 0;
          }
          var a=H0,b=H1,c=H2,d=H3,e=H4,f=H5,g=H6,h=H7;
          for (var t = 0; t < 64; t++) {
            var S1 = rotr(6, e) ^ rotr(11, e) ^ rotr(25, e);
            var ch = (e & f) ^ (~e & g);
            var temp1 = (h + S1 + ch + K[t] + W[t]) | 0;
            var S0 = rotr(2, a) ^ rotr(13, a) ^ rotr(22, a);
            var maj = (a & b) ^ (a & c) ^ (b & c);
            var temp2 = (S0 + maj) | 0;
            h = g; g = f; f = e; e = (d + temp1) | 0;
            d = c; c = b; b = a; a = (temp1 + temp2) | 0;
          }
          H0=(H0+a)|0; H1=(H1+b)|0; H2=(H2+c)|0; H3=(H3+d)|0;
          H4=(H4+e)|0; H5=(H5+f)|0; H6=(H6+g)|0; H7=(H7+h)|0;
        }
        var out = new Uint8Array(32);
        var odv = new DataView(out.buffer);
        [H0,H1,H2,H3,H4,H5,H6,H7].forEach(function(v, i) { odv.setInt32(i * 4, v, false); });
        return out;
      }
      function encryptPassword(plain) {
        if (!plain || typeof plain !== 'string' || plain.indexOf('ENC:v1:') === 0) return plain;
        var nonce = new Uint8Array(16);
        window.crypto.getRandomValues(nonce);
        var nonceHex = Array.from(nonce).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
        var plainBytes = new TextEncoder().encode(plain);
        var cipherBytes = new Uint8Array(plainBytes.length);
        var block = null;
        for (var i = 0; i < plainBytes.length; i++) {
          if (i % 32 === 0) {
            block = sha256Bytes(SECRET + ':' + nonceHex + ':' + Math.floor(i / 32));
          }
          cipherBytes[i] = plainBytes[i] ^ block[i % 32];
        }
        var bin = '';
        for (var i = 0; i < cipherBytes.length; i++) bin += String.fromCharCode(cipherBytes[i]);
        return 'ENC:v1:' + nonceHex + ':' + btoa(bin);
      }
      var origSend = XMLHttpRequest.prototype.send;
      XMLHttpRequest.prototype.send = function (body) {
        if (typeof body === 'string' && body.indexOf('"password"') !== -1) {
          try {
            var parsed = JSON.parse(body);
            if (parsed && typeof parsed.password === 'string') {
              parsed.password = encryptPassword(parsed.password);
              body = JSON.stringify(parsed);
            }
          } catch (e) {}
        }
        return origSend.call(this, body);
      };
    })();
